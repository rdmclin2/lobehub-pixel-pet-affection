<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Offline by design: no remote fonts / emoji CDN (FontLoader is never rendered). css-in-js needs inline styles.
         'wasm-unsafe-eval': the 聊天 page's code blocks are highlighted by shiki's bundled WebAssembly engine (no JS eval). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: pack:; media-src 'self' blob: pack:; font-src 'self' data:; connect-src 'self' pack:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pet 设置</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
