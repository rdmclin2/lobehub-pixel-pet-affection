<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pack: blob:; connect-src 'self' pack: blob:" />
  <title>像素小院</title>
  <link rel="stylesheet" href="../design/lobe-tokens.css" />
  <link rel="stylesheet" href="scene.css" />
</head>
<body>
  <!-- 像素小院 (src/main/scene-window.js, docs/pixel-scene.md): the yard is drawn on one canvas at 320×200 logical
       px, scaled by a whole number (scene.js); the title bar, the 天色 card and her bubble are DOM on top. -->
  <canvas id="stage" aria-label="像素小院：点空地让她走过去，点长椅、花坛、路灯或池塘让她去玩"></canvas>
  <div id="bubble" class="bubble hidden" role="status" aria-live="polite"></div>

  <header class="titlebar">
    <span class="title">像素小院</span>
    <span id="who" class="who"></span>
    <span class="spacer"></span>
    <button id="btn-close" class="tb-btn" title="关闭小院，她回到桌面（Ctrl/⌘ + W）" aria-label="关闭小院"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </header>

  <!-- 天色: time of day (continuous slider, four phases, 跟随时间) and weather (天气自己变). Esc folds it. -->
  <section id="sky-card" class="sky-card folded" aria-label="天色">
    <div class="sky-col" id="time-col">
      <div class="col-head">
        <span id="time-icon" class="big-icon" aria-hidden="true"></span>
        <div class="col-title">
          <span class="col-label">时段</span>
          <b id="time-name" class="col-value"></b>
        </div>
        <span class="spacer"></span>
        <button class="step-btn" id="time-prev" title="上一个时段" aria-label="上一个时段"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="step-btn" id="time-next" title="下一个时段" aria-label="下一个时段"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <input id="time-slider" class="slider" type="range" min="0" max="23.75" step="0.25" aria-label="小院时刻" />
      <div class="chips" id="phase-chips" role="group" aria-label="时段">
        <button class="chip" data-phase="dawn">黎明</button>
        <button class="chip" data-phase="day">白天</button>
        <button class="chip" data-phase="dusk">黄昏</button>
        <button class="chip" data-phase="night">夜晚</button>
      </div>
      <label class="switch-row"><span>跟随时间</span><button id="follow-clock" class="switch" role="switch" aria-checked="false" aria-label="跟随时间"><i></i></button></label>
    </div>
    <div class="sky-col" id="weather-col">
      <div class="col-head">
        <span id="weather-icon" class="big-icon" aria-hidden="true"></span>
        <div class="col-title">
          <span class="col-label">天气</span>
          <b id="weather-name" class="col-value"></b>
        </div>
        <span class="spacer"></span>
        <button class="step-btn" id="weather-prev" title="上一种天气" aria-label="上一种天气"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="step-btn" id="weather-next" title="下一种天气" aria-label="下一种天气"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="chips weather-chips" id="weather-chips" role="group" aria-label="天气">
        <button class="chip" data-weather="clear">晴</button>
        <button class="chip" data-weather="cloudy">多云</button>
        <button class="chip" data-weather="rain">小雨</button>
        <button class="chip" data-weather="snow">雪</button>
        <button class="chip" data-weather="storm">雷雨</button>
        <button class="chip" data-weather="fog">雾</button>
      </div>
      <label class="switch-row"><span>天气自己变</span><button id="auto-weather" class="switch" role="switch" aria-checked="false" aria-label="天气自己变"><i></i></button></label>
    </div>
    <p id="sky-hint" class="sky-hint"></p>
  </section>
  <button id="btn-fold" class="fold-btn" title="收起 / 展开天色卡片（Esc）" aria-label="天色卡片" aria-expanded="true" aria-controls="sky-card"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg></button>

  <script src="../../core/fx.js"></script>
  <script src="../../core/scene-time.js"></script>
  <script src="../../core/scene-weather.js"></script>
  <script src="../../core/scene-map.js"></script>
  <script src="../../core/scene-pet.js"></script>
  <script src="scene-art.js"></script>
  <script src="scene.js"></script>
</body>
</html>
