<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Pixel Pet</title>
  <link rel="stylesheet" href="../design/lobe-tokens.css" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 她的面板 (src/main/pet-panel.js): a right click (or a long press) on her opens it beside her. Her state on
       top, what you can do with her below; panel.js fills it from what her window sends. -->
  <div id="pet-panel" class="pet-panel" role="dialog" aria-label="她的状态" tabindex="-1">
    <div id="status-panel" class="pp-status">
      <div class="pp-head">
        <div class="pp-who"><b id="pp-name" class="pp-name"></b><span id="pp-char" class="pp-char"></span></div>
        <span id="aff-stage" class="aff-stage"></span>
      </div>
      <div id="aff-row" class="aff-row" title="好感度">
        <span class="aff-heart"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></span><i id="bar-affection" class="aff-bar"></i>
        <span id="aff-num" class="aff-num"></span>
      </div>
      <div id="meta" class="meta"></div>
      <div id="bars" class="bars">
        <div class="need" data-need="hunger"><span class="need-label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>饱腹</span><b id="val-hunger" class="need-val"></b><i id="bar-hunger" class="need-bar"></i></div>
        <div class="need" data-need="mood"><span class="need-label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="12" cy="12" r="10"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>心情</span><b id="val-mood" class="need-val"></b><i id="bar-mood" class="need-bar"></i></div>
        <div class="need" data-need="energy"><span class="need-label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg>体力</span><b id="val-energy" class="need-val"></b><i id="bar-energy" class="need-bar"></i></div>
      </div>
    </div>
    <div id="toolbar" class="pp-actions">
      <div class="pp-tiles">
        <button class="pp-tile" data-act="feed" aria-expanded="false" aria-controls="food-menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg><span>喂食</span></button>
        <button class="pp-tile" data-act="play"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg><span>玩耍</span></button>
        <button class="pp-tile" data-act="sleep"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>睡觉</span></button>
        <button class="pp-tile" data-act="chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>聊天</span></button>
      </div>
      <!-- 喂食: what she can eat; picking one feeds her -->
      <div id="food-menu" class="pp-foods hidden" role="group" aria-label="喂她吃什么"></div>
      <div class="pp-foot">
        <button class="btn icon-btn pp-icon" data-act="mute" id="btn-mute" title="静音：让她不出声" aria-label="静音" aria-pressed="false"><svg class="ico mute-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg><svg class="ico mute-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg></button>
        <!-- 跳舞 / 重置姿势: a VRM look only (hidden otherwise); ♪ opens the dance menu in her window -->
        <button class="btn icon-btn pp-icon hidden" data-act="dance" id="btn-dance" title="跳舞" aria-label="跳舞" aria-pressed="false" aria-haspopup="menu" aria-controls="dance-menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
        <button class="btn icon-btn pp-icon hidden" data-act="reset" id="btn-reset" title="重置姿势：不管在做什么，都回到待机（Ctrl/⌘ + Shift + R）" aria-label="重置姿势"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
        <span class="pp-spacer"></span>
        <!-- the way into the settings window (配置后台); the dot says something new waits there -->
        <button class="btn icon-btn pp-icon settings-btn" data-act="settings" id="btn-settings" title="设置（Ctrl/⌘ + ,）" aria-label="设置"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg><b class="new-dot dot hidden" aria-hidden="true"></b></button>
        <!-- 退出 (T-2827): quits at once; everything she remembers is already on disk -->
        <button class="btn icon-btn pp-icon quit-btn" data-act="quit" id="btn-quit" title="退出：关掉桌宠，下次打开她还在" aria-label="退出"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
